# List of the rows in the field.
row_direction: "north_to_south"
rows:
  row1:
    # Specifies a range of sequential numbers for the plots in the row.
    - range:
        # The number of the first plot.
        start: 1059
        # The number of the last plot.
        end: 1065
        # The number of times each plot number repeats.
        repeats: 2
    - range:
        start: 1391
        end: 1431
        repeats: 2
  row2:
    - range:
        start: 1072
        end: 1066
        repeats: 2
    - range:
        start: 1520
        end: 1480
        repeats: 2
  row3:
    - shift:
        row: row1
        amount: 130
  row4:
    - shift:
        row: row2
        amount: 130
  row5:
    - shift:
        row: row3
        amount: 130
  row6:
    - shift:
        row: row4
        amount: 130

